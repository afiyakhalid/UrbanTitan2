spring:
  application:
    name: UrbanTitan
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urbantitan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_SMTP_HOST}
    port: ${MAIL_SMTP_PORT}
    username: ${MAIL_SMTP_USERNAME}
    password: ${MAIL_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          socketFactory:
            fallback: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: urbantitan
    expiry-seconds: 604800
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
  otp:
    expiry-seconds: 300

app:
  notification:
    fallback-email: ${NOTIFICATION_FALLBACK_EMAIL:khadijaparveez05@gmail.com}
