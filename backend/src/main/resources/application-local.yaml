spring:
  application:
    name: UrbanTitan
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urbantitan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: urbantitan
    expiry-seconds: 604800
  otp:
    expiry-seconds: 300
    debug-return: true
