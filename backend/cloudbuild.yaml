steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'asia-south1-docker.pkg.dev/$PROJECT_ID/urbantitan-repo/urbantitan-backend',
        '.'
      ]

  # pushing image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'asia-south1-docker.pkg.dev/$PROJECT_ID/urbantitan-repo/urbantitan-backend'
      ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'urbantitan-backend',
        '--image',
        'asia-south1-docker.pkg.dev/$PROJECT_ID/urbantitan-repo/urbantitan-backend',
        '--region',
        'asia-south1',
        '--platform',
        'managed'
      ]

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/urbantitan-repo/urbantitan-backend
